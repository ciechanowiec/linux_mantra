extends: existence
message: "'%s' should be in lowercase."
link: 'https://developers.google.com/style/colons'
nonword: true
level: error
scope: sentence
tokens:
  - '(?<!:[^ ]+?):\s[A-Z][\w.]*'
# Google's rule allows a capital after a colon for a proper noun (or a full
# sentence); the bare `:\s[A-Z]` token can't tell those from a wrongly-cased
# common word, so it false-fires on `framework: Next.js`. The token captures
# the whole word so these exceptions can whitelist the legitimate cases. The
# first three patterns auto-allow shapes that are never a miscased common word;
# the explicit list covers single-word proper nouns that appear after a colon
# in this repo's docs (extend it when a new product name lands after a colon).
exceptions:
  - '[A-Z]{2,}'          # acronyms: AWS, ODF, TSR, NVDA, SQL, RDS, SSO, GMS, IAM
  - '[A-Z][a-z]+\.'      # dotted product names: Next.js, Node.js
  - 'Payload'
  - 'Flutter'
  - 'Microsoft'
  - 'Storybook'
  - 'Amazon'
  - 'Google'
  - 'Azure'
  - 'Braze'
  - 'Cloudinary'
  - 'CloudFront'
  - 'Redshift'
  - 'BigQuery'
  - 'Deloitte'
  - 'PwC'
  - 'KPMG'
  - 'EY'
  - 'Kanban'
  - 'Scrum'
