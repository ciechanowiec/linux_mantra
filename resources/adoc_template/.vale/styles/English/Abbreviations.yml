  arg: argument
  args: arguments
  attr: attribute
  attrs: attributes
  btn: button
  buf: buffer
  cb: callback
  cfg: configuration
  cmd: command
  cmds: commands
  conf: configuration
  config: configuration
  configs: configurations
  creds: credentials
  ctx: context
  curr: current
  db: database
  dbs: databases
  dep: dependency
  deps: dependencies
  dest: destination
  dev: development
  dir: directory
  dirs: directories
  doc: document
  docs: documentation
  env: environment
  envs: environments
  err: error
  errs: errors
  expr: expression
  exprs: expressions
  ext: extension
  exts: extensions
  fn: function
  func: function
  funcs: functions
  idx: index
  impl: implementation
  impls: implementations
  info: information
  init: initialize|initialization
  intl: international
  lib: library
  libs: libraries
  len: length
  misc: miscellaneous
  mod: module
  mods: modules
  msg: message
  msgs: messages
  num: number
  nums: numbers
