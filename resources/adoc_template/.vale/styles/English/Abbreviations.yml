extends: substitution
message: "Use '%s' instead of '%s' - do not abbreviate words in prose."
link: "https://github.com/sindresorhus/eslint-plugin-unicorn/blob/v68.0.0/rules/shared/name-replacements.js"
ignorecase: true
level: error
action:
  name: replace
swap:
