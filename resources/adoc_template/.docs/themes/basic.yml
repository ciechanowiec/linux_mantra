extends: default-with-font-fallbacks
font:
  catalog:
    merge: true
    Noto Emoji Full:
      normal: NotoEmoji-Regular.ttf
      bold: NotoEmoji-Regular.ttf
      italic: NotoEmoji-Regular.ttf
      bold_italic: NotoEmoji-Regular.ttf
  fallbacks: [M+ 1p Fallback, Noto Emoji Full, Noto Emoji]
image:
  align: center
  caption:
    align: inherit
footer:
  columns: =100%
  recto:
    center:
      content: '{page-number}'
  verso:
    center:
      content: '{page-number}'
table:
  # The default theme distinguishes a header row by bold weight alone, which
  # a reader loses on a dense table and on a row that repeats across a page
  # break. Shading and a heavier rule under the head make the boundary
  # between labels and data visible at a glance.
  head:
    background-color: 'F4F6F8'
    font-style: bold
    border-bottom-width: 1.25
  border-color: 'B0B7BE'
  grid-color: 'D6DADE'
role:
  red:
    font-color: ff0000
  bad-icon:
    font-color: 'C9302C'
  good-icon:
    font-color: '1E7E34'
source_fields:
  font-size: 7.5
  font-color: '595959'
  line-height: 1.1
