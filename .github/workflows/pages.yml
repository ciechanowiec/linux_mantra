# Publishes the GitHub Pages site: the stylesheets and the footer script that AsciiDoc documents load from
# https://www.ciechanowiec.eu/linux_mantra/. Maven builds them from docs/ on the Node and pnpm the Airness
# release pins, into docs/target/site, which is deployed as the site root so every file keeps its URL.
name: 'Pages'

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one instead of cancelling it half-deployed.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Set up Java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'
      - name: 'Install Maven 3.10.0'
        run: |
          set -eu
          archive="$RUNNER_TEMP/apache-maven-3.10.0-bin.tar.gz"
          curl --fail --silent --show-error --location \
            'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa' \
            "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.10.0/bin" >> "$GITHUB_PATH"
      # The node-run execution of the root pom.xml builds the site in generate-resources, after the pinned Node
      # and pnpm are installed and the locked dependencies of docs/ are installed with them.
      - name: 'Build the site'
        run: mvn --batch-mode generate-resources
      - name: 'Upload the site'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'docs/target/site'

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: 'github-pages'
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 'Deploy the site'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
